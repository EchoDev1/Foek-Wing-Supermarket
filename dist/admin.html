<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Foek Wing Supermarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    .login-container {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
    }
    .error-msg {
      color: red;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
  <script type="module" crossorigin src="./assets/admin-DbYHhh11.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/style-C9AYG1SP.js">
  <link rel="stylesheet" crossorigin href="./assets/style-DfHNGYdk.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo-container">
      <img src="./assets/stamp_badge-jiDPmJdO.png" alt="Foek Wing Supermarket Official Logo" class="seal-logo">
      <span class="site-title">Admin Portal</span>
    </a>
  </header>

  <main class="container">
    <div class="glass-card login-container">
      <h2 style="text-align: center; margin-bottom: 2rem;">Admin Login</h2>
      <div id="error-msg" class="error-msg">Invalid email or password.</div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
      </form>
    </div>
  </main>

</body>
</html>
